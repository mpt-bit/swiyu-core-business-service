<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <style th:fragment="email-styles">
            body {
                margin: 0;
                padding: 24px 16px;
                background-color: #ffffff;
                color: #1a1a1a;
                font-family: Arial, Helvetica, sans-serif;
                font-size: 15px;
                line-height: 1.5;
            }
            section {
                max-width: 640px;
                margin: 0 auto;
            }
            p {
                margin: 0 0 14px 0;
            }
            ul {
                margin: 0 0 14px 0;
                padding-left: 20px;
            }
            li {
                margin: 0 0 6px 0;
            }
            a {
                color: #1f5aa6;
                text-decoration: underline;
            }
            hr {
                max-width: 640px;
                margin: 32px auto;
                border: 0;
                border-top: 1px solid #cccccc;
            }
            .signature {
                margin-top: 20px;
            }
            .signature p {
                margin: 0;
            }
            .signature-logo {
                margin-top: 16px;
            }
            img {
                border: 0;
                display: block;
                max-width: 100%;
                height: auto;
            }
        </style>
    </head>
</html>
